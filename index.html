<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Returns Calculator</title>
<style>
  :root { --bg:#0a0a0a; --surface:#141414; --surface2:#1e1e1e; --border:#2a2a2a; --text:#f0f0f0; --muted:#888; --green:#00c87a; --blue:#3b9eff; --red:#ff4f4f; --amber:#ffb830; --purple:#b57bff; --radius:10px; --font:'DM Mono','Courier New',monospace; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { background:var(--bg); color:var(--text); font-family:var(--font); font-size:14px; min-height:100vh; }
  body { padding:0 0 80px; }
  .header { background:var(--surface); border-bottom:1px solid var(--border); padding:14px 16px; position:sticky; top:0; z-index:100; display:flex; align-items:center; justify-content:space-between; }
  .header h1 { font-size:15px; font-weight:600; letter-spacing:0.05em; }
  .header .subtitle { font-size:11px; color:var(--muted); margin-top:1px; }
  .header-right { text-align:right; }
  .header-right .cost { font-size:18px; font-weight:600; }
  .header-right .lbl { font-size:10px; color:var(--muted); }
  .controls { padding:12px 16px; background:var(--surface); border-bottom:1px solid var(--border); display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .controls-row2 { padding:8px 16px 12px; background:var(--surface); border-bottom:1px solid var(--border); display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .ctrl label { display:block; font-size:10px; color:var(--muted); margin-bottom:3px; letter-spacing:0.05em; text-transform:uppercase; }
  select,input[type="number"],input[type="text"] { width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:7px 8px; font-family:var(--font); font-size:13px; appearance:none; -webkit-appearance:none; outline:none; }
  select:focus,input[type="number"]:focus,input[type="text"]:focus { border-color:var(--blue); }
  .sel-top input[type="text"],.sel-top input[type="text"]:focus { background:transparent !important; border-color:transparent !important; outline:none; }
  .section-head { padding:10px 16px 6px; }
  .section-head span { font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); }
  .sel-list { padding:0 16px; display:flex; flex-direction:column; gap:8px; margin-bottom:4px; }
  .sel-row { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:10px 12px; }
  .sel-row.is-golfer { border-left:3px solid var(--blue) !important; }
  .sel-row.is-horse { border-left:3px solid var(--border); }
  .sel-row.is-golfer.status-place { border-left:3px solid var(--amber) !important; }
  .sel-row.is-golfer.status-win { border-left:3px solid var(--green) !important; }
  .sel-row.is-horse.status-win,.sel-row.is-horse.status-place { border-left:3px solid var(--green); }
  .sel-row.is-horse.status-place { border-left:3px solid var(--amber); }
  .sel-row.is-horse.status-nr { border-left:3px solid var(--purple); opacity:0.6; }
  .sel-row.status-lose { opacity:0.45; }
  .sel-top { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .sel-top input[type="text"] { flex:1; font-size:14px; font-weight:500; padding:4px 0; }
  .type-tag { font-size:10px; padding:2px 7px; border-radius:20px; white-space:nowrap; }
  .type-tag.golfer { background:#1a3a5c; color:var(--blue); }
  .type-tag.horse { background:var(--surface2); color:var(--muted); }
  .fields-row { display:grid; gap:6px; margin-bottom:6px; }
  .cols2 { grid-template-columns:1fr 1fr; }
  .cols3 { grid-template-columns:1fr 1fr 1fr; }
  .cols4 { grid-template-columns:1fr 1fr 1fr 1fr; }
  .cols5 { grid-template-columns:1fr 1fr 1fr 1fr 1fr; }
  .field label { font-size:10px; color:var(--muted); display:block; margin-bottom:3px; text-transform:uppercase; letter-spacing:0.04em; }
  .ev-strip { display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; }
  .ev-pill { font-size:11px; padding:2px 8px; border-radius:20px; }
  .ev-pill.pos { background:#00c87a22; color:var(--green); font-weight:600; }
  .ev-pill.neg { background:#ff4f4f22; color:var(--red); }
  .ev-pill.muted { background:var(--surface2); color:var(--muted); }
  .divider { height:1px; background:var(--border); margin:12px 0; }
  .metrics { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--border); margin:12px 16px; border-radius:var(--radius); overflow:hidden; }
  .metric { background:var(--surface); padding:12px; }
  .metric .ml { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:4px; }
  .metric .mv { font-size:20px; font-weight:600; }
  .mv.pos { color:var(--green); }
  .mv.neg { color:var(--red); }
  .mv.neutral { color:var(--text); }
  .filter-bar { display:flex; gap:6px; padding:0 16px 10px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .filter-bar::-webkit-scrollbar { display:none; }
  .fbtn { flex-shrink:0; font-size:12px; padding:5px 12px; border-radius:20px; border:1px solid var(--border); background:transparent; color:var(--muted); font-family:var(--font); cursor:pointer; }
  .fbtn.active { background:var(--blue); color:#fff; border-color:var(--blue); }
  .combos { padding:0 16px; display:flex; flex-direction:column; gap:6px; }
  .combo-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:10px 12px; }
  .combo-card.has-golfer { border-left:3px solid var(--blue); }
  .combo-card.dead { opacity:0.3; }
  .combo-card.has-nr { border-left:3px solid var(--purple); }
  .combo-name { font-size:12px; font-weight:600; margin-bottom:5px; line-height:1.4; }
  .nr-tag { font-size:10px; color:var(--purple); margin-bottom:4px; }
  .combo-stats { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; }
  .cstat { text-align:center; }
  .cstat .csl { font-size:9px; color:var(--muted); text-transform:uppercase; margin-bottom:2px; }
  .cstat .csv { font-size:12px; font-weight:600; }
  .csv.pos { color:var(--green); }
  .csv.win { color:var(--amber); }
  .csv.live { color:var(--blue); }
  .csv.dead { color:var(--red); }
  .csv.muted { color:var(--muted); }
  .summary-bar { padding:8px 16px; font-size:11px; color:var(--muted); }
  .sel-summary { margin:0 16px 10px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
  .sel-summary-table { width:100%; border-collapse:collapse; font-size:11px; }
  .sel-summary-table th { padding:6px 8px; text-align:left; color:var(--muted); font-weight:500; font-size:10px; text-transform:uppercase; letter-spacing:0.04em; border-bottom:1px solid var(--border); background:var(--surface2); white-space:nowrap; }
  .sel-summary-table td { padding:5px 8px; border-bottom:1px solid var(--border); white-space:nowrap; color:var(--text); font-size:11px; }
  .sel-summary-table tr:last-child td { border-bottom:none; }
  .sel-summary-table td.label { color:var(--muted); font-size:10px; }
  .sel-summary-table .g-row td { background:#1a3a5c22; }
  .sel-summary-table .h-row td { }
  .ss-pos { color:var(--green); font-weight:600; }
  .ss-neg { color:var(--red); }
  .ss-muted { color:var(--muted); }
  @media(max-width:380px){ .combo-stats{grid-template-columns:repeat(3,1fr);} .cols5{grid-template-columns:1fr 1fr 1fr;} .cols4{grid-template-columns:1fr 1fr;} }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<div class="header">
  <div><h1>RETURNS CALC</h1><div class="subtitle">E/W Multiples + EV</div></div>
  <div class="header-right">
    <div class="cost" id="hcost">£0.00</div>
    <div class="lbl">SLIP COST</div>
  </div>
</div>

<div class="controls">
  <div class="ctrl"><label>Golfers</label>
    <select id="num-golfers">
      <option value="0" selected>0 — horses only</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
    </select>
  </div>
  <div class="ctrl"><label>Horses</label>
    <select id="num-horses">
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6">6</option>
      <option value="7" selected>7</option>
    </select>
  </div>
  <div class="ctrl"><label>Bet type</label>
    <select id="bet-type">
      <option value="2">Doubles</option>
      <option value="3" selected>Trebles</option>
      <option value="4">4-folds</option>
      <option value="5">5-folds</option>
    </select>
  </div>
</div>
<div class="controls-row2">
  <div class="ctrl"><label>Stake e/w (£)</label>
    <input type="number" id="stake" value="0.50" min="0.10" step="0.10">
  </div>
  <div class="ctrl"><label>Odds format</label>
    <select id="odds-format">
      <option value="fractional">Fractional (e.g. 17 = 17/1)</option>
      <option value="decimal" selected>Decimal (e.g. 18.0)</option>
    </select>
  </div>
</div>

<div id="golfer-section">
  <div class="section-head"><span id="glabel">2 Golfers</span></div>
  <div class="sel-list" id="golfer-list"></div>
  <div class="divider"></div>
</div>

<div class="section-head"><span id="hlabel">5 Horses</span></div>
<div class="sel-list" id="horse-list"></div>
<div class="divider"></div>

<div id="sel-summary"></div>
<div class="metrics" id="metrics"></div>

<div class="filter-bar">
  <button class="fbtn active" data-filter="all">All</button>
  <button class="fbtn" data-filter="live">Live</button>
  <button class="fbtn" data-filter="placed">Placed</button>
  <button class="fbtn" data-filter="golfer">With golfer</button>
  <button class="fbtn" data-filter="horse">Horses only</button>
  <button class="fbtn" data-filter="evpos">+EV only</button>
  <button class="fbtn" data-filter="nr">NR</button>
  <button class="fbtn" data-filter="top">Top 20</button>
</div>

<div class="summary-bar" id="sbar"></div>
<div class="combos" id="combos"></div>

<script>
const S = {
  numGolfers:0, numHorses:7, betType:3,
  stake:0.50, oddsFormat:'decimal',
  golfers:[], horses:[], filter:'all'
};

const dG = [
  {name:'Golfer 1', odds:'', fairWin:'', fairPlace:'', terms:5, places:10, status:'tbd'},
  {name:'Golfer 2', odds:'', fairWin:'', fairPlace:'', terms:5, places:10, status:'tbd'},
  {name:'Golfer 3', odds:'', fairWin:'', fairPlace:'', terms:5, places:10, status:'tbd'},
  {name:'Golfer 4', odds:'', fairWin:'', fairPlace:'', terms:5, places:10, status:'tbd'},
];
const dH = [
  {name:'Horse 1', odds:'', fairWin:'', fairPlace:'', terms:5, status:'tbd'},
  {name:'Horse 2', odds:'', fairWin:'', fairPlace:'', terms:5, status:'tbd'},
  {name:'Horse 3', odds:'', fairWin:'', fairPlace:'', terms:5, status:'tbd'},
  {name:'Horse 4', odds:'', fairWin:'', fairPlace:'', terms:5, status:'tbd'},
  {name:'Horse 5', odds:'', fairWin:'', fairPlace:'', terms:5, status:'tbd'},
  {name:'Horse 6', odds:'', fairWin:'', fairPlace:'', terms:5, status:'tbd'},
  {name:'Horse 7', odds:'', fairWin:'', fairPlace:'', terms:5, status:'tbd'},
];

let allCombos = [];

function init() {
  while(S.golfers.length < S.numGolfers)
    S.golfers.push({...(dG[S.golfers.length] || {name:`Golfer ${S.golfers.length+1}`, odds:'', fairWin:'', fairPlace:'', terms:5, places:10, status:'tbd'})});
  while(S.horses.length < S.numHorses)
    S.horses.push({...(dH[S.horses.length] || {name:`Horse ${S.horses.length+1}`, odds:'', fairWin:'', fairPlace:'', terms:5, status:'tbd'})});
  S.golfers = S.golfers.slice(0, S.numGolfers);
  S.horses  = S.horses.slice(0, S.numHorses);
}

// Convert entered odds to fractional profit for all calculations
// Decimal: 26.0 means 25/1, so subtract 1 to get fractional profit = 25
// Fractional: 25 means 25/1, already fractional profit = 25
function toFrac(odds) {
  const o = parseFloat(odds);
  if (!o || isNaN(o) || o <= 0) return 0;
  if (S.oddsFormat === 'decimal') return o - 1;  // 26.0 -> 25
  return o;                                        // 25 stays 25
}

// Keep toDecimal as alias
function toDecimal(odds) { return toFrac(odds); }

// Place odds: fractionalProfit / terms + 1
// e.g. frac 25 / 5 + 1 = 6.0
function po(fracOdds, terms) { return fracOdds / terms + 1; }
function placed(s) { return s==='win'||s==='place'; }
function won(s) { return s==='win'; }
function isNR(s) { return s==='nr'; }

// EV% = book / fair * 100
function winEVpct(bookOdds, fairWin) {
  // Use raw entered values for win EV ratio — both book and fair entered same way
  const bo = parseFloat(bookOdds);
  const fw = parseFloat(fairWin);
  if (!bo || isNaN(bo) || bo <= 0) return null;
  if (!fw || isNaN(fw) || fw <= 0) return null;
  // Win EV% = book / fair * 100 (same format both sides cancels out)
  // Decimal: 26/30 * 100 = 86.7%
  // Fractional: 25/29 * 100 = 86.2% (slightly different but correct)
  return (bo / fw) * 100;
}

function placeEVpct(bookOdds, fairPlace, terms) {
  const bo = toFrac(bookOdds); // convert to fractional profit
  const fp = parseFloat(fairPlace); // always decimal from Betfair e.g. 4.0
  if (!bo || bo <= 0) return null;
  if (!fp || isNaN(fp) || fp <= 0) return null;
  // Book place odds in decimal = fracProfit / terms + 1
  // e.g. frac 25 / 5 + 1 = 6.0
  const bookPO = po(bo, terms);
  // Place EV% = book place decimal / fair place decimal * 100
  // e.g. 6.0 / 4.0 * 100 = 150%
  return (bookPO / fp) * 100;
}

function buildCombos() {
  // Include all selections — filter to valid odds inside combo building
  const allSels = [
    ...S.golfers.map((g,i) => ({
      ...g, type:'golfer', idx:i,
      fracOdds: toDecimal(g.odds),
      bookPO: toDecimal(g.odds) > 0 ? po(toDecimal(g.odds), g.terms||5) : 0,
      hasOdds: toDecimal(g.odds) > 0
    })),
    ...S.horses.map((h,i) => ({
      ...h, type:'horse', idx:i,
      fracOdds: toDecimal(h.odds),
      bookPO: toDecimal(h.odds) > 0 ? po(toDecimal(h.odds), h.terms||5) : 0,
      hasOdds: toDecimal(h.odds) > 0
    }))
  ].filter(s => s.hasOdds); // only include slots where odds have been entered
  const n = S.betType;
  const combos = [];

  function comb(start, cur) {
    if (cur.length === n) {
      if (S.numGolfers >= 2 && cur.filter(s=>s.type==='golfer').length >= 2) return;
      const active = cur.filter(s => !isNR(s.status));
      const nrCount = cur.filter(s => isNR(s.status)).length;
      if (active.length < 2) return;

      const hasG     = active.some(s => s.type==='golfer');
      const lostAny  = active.some(s => s.status==='lose');
      const placedAll= active.every(s => placed(s.status));
      const wonAll   = active.every(s => won(s.status));

      const placeOC = active.reduce((a,s) => a * (s.bookPO - 1), 1);
      const winOC   = active.reduce((a,s) => a * s.fracOdds, 1);
      const placeRet = placedAll ? placeOC * S.stake : 0;
      const winRet   = wonAll   ? winOC   * S.stake : 0;
      const status   = lostAny ? 'dead' : placedAll ? (wonAll?'win':'place') : 'live';

      // Compound place EV% = product of each leg's place EV% / 100 * 100
      const allHavePEV = active.every(s => {
        const terms = s.terms || 5;
        return placeEVpct(s.odds, s.fairPlace, terms) !== null;
      });
      let compPlaceEV = null;
      if (allHavePEV) {
        compPlaceEV = active.reduce((a,s) => {
          return a * (placeEVpct(s.odds, s.fairPlace, s.terms||5) / 100);
        }, 1) * 100;
      }

      const allHaveWEV = active.every(s => winEVpct(s.odds, s.fairWin) !== null);
      let compWinEV = null;
      if (allHaveWEV) {
        compWinEV = active.reduce((a,s) => {
          return a * (winEVpct(s.odds, s.fairWin) / 100);
        }, 1) * 100;
      }

      const legNames = {2:'Double',3:'Treble',4:'4-fold',5:'5-fold'};

      // CORRECT EV for a multiple: compound probabilities × compound odds
      // Win treble: true_prob1 × true_prob2 × true_prob3 × compound_win_odds
      // Place treble: true_place_prob1 × true_place_prob2 × true_place_prob3 × compound_place_odds
      // True win prob = 1 / fair_win_decimal
      // True place prob = 1 / fair_place_decimal
      const allHaveEV = active.every(s => {
        const t = s.terms||5;
        return parseFloat(s.fairPlace) > 0;
      });
      let netEVpound = null;
      let winTrebleEVpct = null;
      let placeTrebleEVpct = null;
      if (allHaveEV) {
        // Compound win probability and odds
        const hasWinFair = active.every(s => parseFloat(s.fairWin) > 0);
        let winTrebleEV = -S.stake; // default: full win stake lost if no fair win data
        if (hasWinFair) {
          const compWinProb = active.reduce((a,s) => a * (1/parseFloat(s.fairWin)), 1);
          const compWinOdds = active.reduce((a,s) => a * (parseFloat(s.odds)-1), 1);
          const winReturn = compWinProb * compWinOdds * S.stake;
          winTrebleEV = winReturn - S.stake;
        }
        // Compound place probability and odds
        const compPlaceProb = active.reduce((a,s) => {
          const fp = parseFloat(s.fairPlace);
          return a * (1/fp);
        }, 1);
        const compPlaceOdds = active.reduce((a,s) => a * (s.bookPO - 1), 1);
        const placeReturn = compPlaceProb * compPlaceOdds * S.stake;
        const placeTrebleEV = placeReturn - S.stake;
        netEVpound = winTrebleEV + placeTrebleEV;
        winTrebleEVpct = (winTrebleEV / S.stake) * 100;
        placeTrebleEVpct = (placeTrebleEV / S.stake) * 100;
      }

      combos.push({
        name: cur.map(s=>s.name).join(' + '),
        hasGolfer:hasG, placeRet, winRet, placeOC, winOC,
        status, livePlace:!lostAny, nrCount,
        betLabel: legNames[active.length]||`${active.length}-fold`,
        compPlaceEV, compWinEV, netEVpound,
        winTrebleEVpct, placeTrebleEVpct,
      });
      return;
    }
    for (let i=start; i<allSels.length; i++) comb(i+1, [...cur, allSels[i]]);
  }
  comb(0, []);
  combos.sort((a,b) => (b.compPlaceEV??0) - (a.compPlaceEV??0) || b.placeRet - a.placeRet);
  return combos;
}

function sc(s) {
  return s==='win'?'status-win':s==='place'?'status-place':s==='lose'?'status-lose':s==='nr'?'status-nr':'';
}

function evPill(pct, label) {
  if (pct===null) return '';
  const cls = pct >= 100 ? 'pos' : 'neg';
  return `<span class="ev-pill ${cls}">${label}: ${pct.toFixed(1)}%</span>`;
}

function renderSels() {
  document.getElementById('glabel').textContent = `${S.numGolfers} Golfer${S.numGolfers!==1?'s':''}`;
  document.getElementById('hlabel').textContent = `${S.numHorses} Horse${S.numHorses!==1?'s':''}`;
  document.getElementById('golfer-section').style.display = S.numGolfers===0 ? 'none' : '';

  document.getElementById('golfer-list').innerHTML = S.golfers.map((g,i) => {
    const terms = g.terms || 5;
    const places = g.places || 10;
    const fracOdds = toDecimal(g.odds);
    const bookPO = fracOdds > 0 ? po(fracOdds, terms) : null;
    const wev = winEVpct(g.odds, g.fairWin||null);
    const pev = placeEVpct(g.odds, g.fairPlace||null, terms);
    return `<div class="sel-row is-golfer ${sc(g.status)}">
      <div class="sel-top">
        <input type="text" value="${g.name}" data-t="golfer" data-i="${i}" data-f="name">
        <span class="type-tag golfer">GOLF</span>
      </div>
      <div class="fields-row cols4">
        <div class="field"><label>Book Win</label>
          <input type="number" value="${g.odds}" min="1" step="1" data-t="golfer" data-i="${i}" data-f="odds"></div>
        <div class="field"><label>Win Fair</label>
          <input type="number" value="${g.fairWin||''}" min="1" step="1" placeholder="—" data-t="golfer" data-i="${i}" data-f="fairWin"></div>
        <div class="field"><label>Place Fair</label>
          <input type="number" value="${g.fairPlace||''}" min="1" step="0.1" placeholder="—" data-t="golfer" data-i="${i}" data-f="fairPlace"></div>
        <div class="field"><label>Result</label>
          <select data-t="golfer" data-i="${i}" data-f="status">
            <option value="tbd" ${g.status==='tbd'?'selected':''}>?</option>
            <option value="win" ${g.status==='win'?'selected':''}>W Won</option>
            <option value="place" ${g.status==='place'?'selected':''}>P Place</option>
            <option value="lose" ${g.status==='lose'?'selected':''}>X Lost</option>
          </select></div>
      </div>
      <div class="fields-row cols3">
        <div class="field"><label>Place terms</label>
          <select data-t="golfer" data-i="${i}" data-f="terms">
            <option value="4" ${terms==4?'selected':''}>1/4 odds</option>
            <option value="5" ${terms==5?'selected':''}>1/5 odds</option>
          </select></div>
        <div class="field"><label>Places paid</label>
          <select data-t="golfer" data-i="${i}" data-f="places">
            <option value="5" ${places==5?'selected':''}>5 places</option>
            <option value="6" ${places==6?'selected':''}>6 places</option>
            <option value="8" ${places==8?'selected':''}>8 places</option>
            <option value="10" ${places==10?'selected':''}>10 places</option>
            <option value="12" ${places==12?'selected':''}>12 places</option>
          </select></div>
        <div class="field"><label>Pl odds</label>
          <div style="font-size:12px;color:var(--green);padding-top:8px;">${bookPO ? bookPO.toFixed(2)+'/1' : '—'}</div></div>
      </div>
      <div class="ev-strip">
        ${evPill(wev, 'Win EV')}
        ${evPill(pev, 'Place EV')}
      </div>
    </div>`;
  }).join('');

  document.getElementById('horse-list').innerHTML = S.horses.map((h,i) => {
    const terms = h.terms||5;
    const fracOdds = toDecimal(h.odds);
    const bookPO = fracOdds > 0 ? po(fracOdds, terms) : null;
    const wev = winEVpct(h.odds, h.fairWin||null);
    const pev = placeEVpct(h.odds, h.fairPlace||null, terms);
    const plPill = h.status==='nr' ? 'NR' : bookPO ? bookPO.toFixed(2)+'/1' : '—';
    return `<div class="sel-row is-horse ${sc(h.status)}">
      <div class="sel-top">
        <input type="text" value="${h.name}" data-t="horse" data-i="${i}" data-f="name">
        <span class="type-tag horse">HORSE</span>
      </div>
      <div class="fields-row cols4">
        <div class="field"><label>Book Win</label>
          <input type="number" value="${h.odds}" min="1" step="1" data-t="horse" data-i="${i}" data-f="odds"></div>
        <div class="field"><label>Win Fair</label>
          <input type="number" value="${h.fairWin||''}" min="1" step="1" placeholder="—" data-t="horse" data-i="${i}" data-f="fairWin"></div>
        <div class="field"><label>Place Fair</label>
          <input type="number" value="${h.fairPlace||''}" min="1" step="0.1" placeholder="—" data-t="horse" data-i="${i}" data-f="fairPlace"></div>
        <div class="field"><label>Terms</label>
          <select data-t="horse" data-i="${i}" data-f="terms">
            <option value="4" ${terms==4?'selected':''}>1/4</option>
            <option value="5" ${terms==5?'selected':''}>1/5</option>
            <option value="3" ${terms==3?'selected':''}>1/3</option>
          </select></div>
      </div>
      <div class="fields-row cols3">
        <div class="field"><label>Result</label>
          <select data-t="horse" data-i="${i}" data-f="status">
            <option value="tbd" ${h.status==='tbd'?'selected':''}>?</option>
            <option value="win" ${h.status==='win'?'selected':''}>W Won</option>
            <option value="place" ${h.status==='place'?'selected':''}>P Place</option>
            <option value="lose" ${h.status==='lose'?'selected':''}>X Lost</option>
            <option value="nr" ${h.status==='nr'?'selected':''}>NR Void</option>
          </select></div>
        <div class="field"><label>Pl odds</label>
          <div style="font-size:12px;padding-top:8px;color:${h.status!=='lose'&&h.status!=='nr'?'var(--green)':'var(--muted)'};">${plPill}</div></div>
        <div class="field">
          <div class="ev-strip" style="margin-top:8px;">
            ${evPill(wev,'Win')}
            ${evPill(pev,'Pl')}
            ${(pev!==null)?`<span class="ev-pill ${(((wev!==null?(wev-100)/100:-1)*S.stake)+((pev-100)/100*S.stake))>=0?'pos':'neg'}">Net/leg: ${(((wev!==null?(wev-100)/100:-1)*S.stake)+((pev-100)/100*S.stake))>=0?'+':''}£${(((wev!==null?(wev-100)/100:-1)*S.stake)+((pev-100)/100*S.stake)).toFixed(2)}</span>`:''}
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function nCr(n, k) {
  if (k > n) return 0;
  if (k === 0 || k === n) return 1;
  let r = 1;
  for (let i = 0; i < k; i++) { r = r * (n - i) / (i + 1); }
  return Math.round(r);
}

function expectedCombos(actualCombos) {
  // If we have actual combos built, use that count
  if (actualCombos && actualCombos.length > 0) return actualCombos.length;
  // Otherwise estimate from dropdowns
  const totalSels = S.numGolfers + S.numHorses;
  const n = S.betType;
  if (totalSels < n) return 0;
  if (S.numGolfers < 2) return nCr(totalSels, n);
  const allCombos = nCr(totalSels, n);
  const twoGolferCombos = nCr(S.numGolfers, 2) * nCr(S.numHorses, n - 2);
  return allCombos - twoGolferCombos;
}

function renderMetrics(combos) {
  const s = S.stake;
  // Use expected combo count for cost so it shows even with empty odds
  const comboCount = expectedCombos(combos);
  const cost = comboCount * s * 2;
  const placeRet = combos.reduce((a,c)=>a+c.placeRet,0);
  const winRet   = combos.reduce((a,c)=>a+c.winRet,0);
  const total    = placeRet + winRet;
  const profit   = total - cost;
  const live     = combos.filter(c=>c.livePlace&&c.status!=='dead').length;
  const withEV     = combos.filter(c=>c.netEVpound!==null&&!isNaN(c.netEVpound));
  const totalNetEV = withEV.reduce((a,c)=>a+c.netEVpound, 0);
  const totalEVpct = cost > 0 ? (totalNetEV / cost) * 100 : 0;
  const hasAnyEV   = withEV.length > 0;
  const posEVcount = withEV.filter(c=>c.netEVpound>0).length;

  document.getElementById('hcost').textContent = '£'+cost.toFixed(2);
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="ml">Slip cost</div><div class="mv neutral">£${cost.toFixed(2)}</div></div>
    <div class="metric"><div class="ml">Combinations</div><div class="mv neutral">${comboCount}</div></div>
    <div class="metric"><div class="ml">Place return</div><div class="mv ${placeRet>0?'pos':'neutral'}">£${placeRet.toFixed(2)}</div></div>
    <div class="metric"><div class="ml">Win return</div><div class="mv ${winRet>0?'pos':'neutral'}">£${winRet.toFixed(2)}</div></div>
    <div class="metric"><div class="ml">Total return</div><div class="mv ${total>0?'pos':'neutral'}">£${total.toFixed(2)}</div></div>
    <div class="metric"><div class="ml">Profit/loss</div><div class="mv ${profit>0?'pos':profit<0?'neg':'neutral'}">${profit>=0?'+':''}£${profit.toFixed(2)}</div></div>
    ${hasAnyEV?`<div class="metric"><div class="ml">Total EV £</div><div class="mv ${totalNetEV>=0?'pos':'neg'}">${totalNetEV>=0?'+':''}£${totalNetEV.toFixed(2)}</div></div>`:''}
    ${hasAnyEV?`<div class="metric"><div class="ml">Total EV %</div><div class="mv ${totalEVpct>=0?'pos':'neg'}">${totalEVpct>=0?'+':''}${totalEVpct.toFixed(1)}%</div></div>`:''}
    ${hasAnyEV?`<div class="metric"><div class="ml">+EV combos</div><div class="mv neutral">${posEVcount}/${comboCount}</div></div>`:''}
  `;
}

function getFiltered(combos) {
  let f=[...combos];
  if(S.filter==='live')   f=f.filter(c=>c.livePlace&&c.status!=='dead');
  else if(S.filter==='placed') f=f.filter(c=>c.status==='place'||c.status==='win');
  else if(S.filter==='golfer') f=f.filter(c=>c.hasGolfer);
  else if(S.filter==='horse')  f=f.filter(c=>!c.hasGolfer);
  else if(S.filter==='evpos')  f=f.filter(c=>c.compPlaceEV!==null&&c.compPlaceEV>=100);
  else if(S.filter==='nr')     f=f.filter(c=>c.nrCount>0);
  else if(S.filter==='top')    f=f.slice(0,20);
  return f;
}

function renderCombos(combos) {
  const vis=getFiltered(combos);
  const live=combos.filter(c=>c.livePlace&&c.status!=='dead').length;
  const placed=combos.filter(c=>c.status==='place'||c.status==='win').length;
  const evpos=combos.filter(c=>c.compPlaceEV!==null&&c.compPlaceEV>=100).length;
  document.getElementById('sbar').textContent=
    `${combos.length} combos — ${live} live — ${placed} cashed — ${evpos} +EV`;

  document.getElementById('combos').innerHTML=vis.map(c=>{
    const isDead=c.status==='dead';
    const statLabel=c.status==='win'?'W+P':c.status==='place'?'P':c.status==='dead'?'DEAD':'LIVE';
    const statClass=c.status==='win'?'win':c.status==='place'?'pos':c.status==='dead'?'dead':'live';
    const netStr = (c.netEVpound!=null&&!isNaN(c.netEVpound)) ? (c.netEVpound>=0?'+':'')+'£'+c.netEVpound.toFixed(2) : '—';
    const netCls = (c.netEVpound!=null&&!isNaN(c.netEVpound)) ? (c.netEVpound>=0?'pos':'neg') : 'muted';
    // Net EV% = netEVpound / (stake*2) * 100
    const netEvPct = (c.netEVpound!=null&&!isNaN(c.netEVpound)) ? (c.netEVpound / (S.stake*2)) * 100 : null;
    const netEvPctStr = netEvPct!==null ? (netEvPct>=0?'+':'')+netEvPct.toFixed(1)+'%' : '—';
    const netEvPctCls = netEvPct!==null ? (netEvPct>=0?'pos':'neg') : 'muted';
    const nrBadge=c.nrCount>0?`<div class="nr-tag">NR void → ${c.betLabel}</div>`:'';
    return `<div class="combo-card ${c.hasGolfer?'has-golfer':''} ${isDead?'dead':''} ${c.nrCount>0&&!isDead?'has-nr':''}" style="${isDead?'opacity:0.3;':''}">
      ${nrBadge}
      <div class="combo-name">${c.name}</div>
      <div class="combo-stats">
        <div class="cstat"><div class="csl">Status</div><div class="csv ${statClass}">${statLabel}</div></div>
        <div class="cstat"><div class="csl">Win EV%</div><div class="csv ${c.winTrebleEVpct!=null?(c.winTrebleEVpct>=0?'pos':'neg'):'muted'}">${c.winTrebleEVpct!=null?(c.winTrebleEVpct>=0?'+':'')+c.winTrebleEVpct.toFixed(0)+'%':'—'}</div></div>
        <div class="cstat"><div class="csl">Place EV%</div><div class="csv ${c.placeTrebleEVpct!=null?(c.placeTrebleEVpct>=0?'pos':'neg'):'muted'}">${c.placeTrebleEVpct!=null?(c.placeTrebleEVpct>=0?'+':'')+c.placeTrebleEVpct.toFixed(0)+'%':'—'}</div></div>
        <div class="cstat"><div class="csl">Net EV%</div><div class="csv ${netEvPctCls}">${netEvPctStr}</div></div>
        <div class="cstat"><div class="csl">Net EV £</div><div class="csv ${netCls}">${netStr}</div></div>
        <div class="cstat"><div class="csl">Pl odds</div><div class="csv muted">${c.placeOC.toFixed(0)}/1</div></div>
      </div>
    </div>`;
  }).join('');
}

function renderSelSummary() {
  const el = document.getElementById('sel-summary');
  const allActive = [
    ...S.golfers.map((g,i) => ({...g, type:'golfer', idx:i})),
    ...S.horses.map((h,i) => ({...h, type:'horse', idx:i}))
  ].filter(s => parseFloat(s.odds) > 0);

  if (allActive.length === 0) { el.innerHTML = ''; return; }

  const rows = allActive.map(s => {
    const isG = s.type === 'golfer';
    const terms = isG ? (s.terms||5) : (s.terms||5);
    const frac = toFrac(s.odds);
    const bookPO = frac > 0 ? po(frac, terms) : null;
    const wev = winEVpct(s.odds, s.fairWin);
    const pev = placeEVpct(s.odds, s.fairPlace, terms);
    const wEVp = wev !== null ? ((wev-100)/100)*S.stake : null;
    const pEVp = pev !== null ? ((pev-100)/100)*S.stake : null;
    const netEV = (wEVp !== null && pEVp !== null) ? wEVp + pEVp : (pEVp !== null ? ((toFrac(s.odds)>0?-1:0)*S.stake + pEVp) : null);

    const fairWinStr = parseFloat(s.fairWin) > 0 ? parseFloat(s.fairWin) : '—';
    const fairPlStr = parseFloat(s.fairPlace) > 0 ? parseFloat(s.fairPlace) : '—';
    const bookPOStr = bookPO ? bookPO.toFixed(1) : '—';

    const wEvStr = wev !== null ? `<span class="${wev>=100?'ss-pos':'ss-neg'}">${wev.toFixed(1)}%</span>` : '<span class="ss-muted">—</span>';
    const pEvStr = pev !== null ? `<span class="${pev>=100?'ss-pos':'ss-neg'}">${pev.toFixed(1)}%</span>` : '<span class="ss-muted">—</span>';
    // Net EV% = (win EV£ + place EV£) / (stake * 2) * 100
    // stake*2 = total e/w cost per selection
    const wEVp2 = wev !== null ? ((wev-100)/100)*S.stake : -S.stake;
    const pEVp2 = pev !== null ? ((pev-100)/100)*S.stake : null;
    const netEVpct = pEVp2 !== null ? ((wEVp2 + pEVp2) / (S.stake*2)) * 100 : null;
    const netStr = netEVpct !== null ? `<span class="${netEVpct>=0?'ss-pos':'ss-neg'}">${netEVpct>=0?'+':''}${netEVpct.toFixed(1)}%</span>` : '<span class="ss-muted">—</span>';

    const label = isG ? `${s.name}` : s.name;
    const rowClass = isG ? 'g-row' : 'h-row';

    return `<tr class="${rowClass}">
      <td class="label">${label}${isG?` <span style="font-size:9px;color:var(--blue);">GOLF</span>`:''}</td>
      <td>${s.odds} / ${fairWinStr}</td>
      <td>${bookPOStr} / ${fairPlStr}</td>
      <td>${wEvStr}</td>
      <td>${pEvStr}</td>
      <td>${netStr}</td>
    </tr>`;
  }).join('');

  el.innerHTML = `<div class="sel-summary">
    <table class="sel-summary-table">
      <thead>
        <tr>
          <th>Selection</th>
          <th>Win / Fair</th>
          <th>Place / Fair</th>
          <th>Win EV</th>
          <th>Place EV</th>
          <th>Net EV%</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function render() {
  init(); renderSels();
  allCombos=buildCombos();
  renderMetrics(allCombos);
  renderSelSummary();
  renderCombos(allCombos);
}

document.addEventListener('change', e=>{
  const el=e.target;
  if(el.id==='num-golfers'){S.numGolfers=parseInt(el.value);render();return;}
  if(el.id==='num-horses'){S.numHorses=parseInt(el.value);render();return;}
  if(el.id==='bet-type'){S.betType=parseInt(el.value);render();return;}
  if(el.id==='stake'){S.stake=parseFloat(el.value)||0.50;allCombos=buildCombos();renderMetrics(allCombos);renderSelSummary();renderCombos(allCombos);return;}
  if(el.id==='odds-format'){S.oddsFormat=el.value;allCombos=buildCombos();renderMetrics(allCombos);renderCombos(allCombos);return;}
  const t=el.dataset.t, f=el.dataset.f, i=parseInt(el.dataset.i);
  if(!t||!f) return;
  const v=(f==='name'||f==='status')?el.value:parseFloat(el.value)||'';
  if(t==='golfer') S.golfers[i][f]=v; else S.horses[i][f]=v;
  allCombos=buildCombos(); renderMetrics(allCombos); renderSelSummary(); renderCombos(allCombos);
  if(f!=='status') renderSels();
});

document.addEventListener('input', e=>{
  const el=e.target, t=el.dataset.t, f=el.dataset.f, i=parseInt(el.dataset.i);
  if(!t||f!=='name') return;
  if(t==='golfer') S.golfers[i].name=el.value; else S.horses[i].name=el.value;
  allCombos=buildCombos(); renderCombos(allCombos);
});

document.addEventListener('click', e=>{
  const btn=e.target.closest('.fbtn');
  if(!btn) return;
  S.filter=btn.dataset.filter;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active',b===btn));
  renderCombos(allCombos);
});

render();
</script>
</body>
</html>
